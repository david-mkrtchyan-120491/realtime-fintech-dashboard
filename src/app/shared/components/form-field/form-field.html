<div class="form-field">
  <label class="form-field__label" [for]="fieldId()">{{ label() }}</label>
  <p class="form-field__hint" [id]="fieldId() + '-hint'">Whole numbers from {{ min() }} to {{ max() }}, inclusive.</p>
  <input
    class="form-field__input"
    [class.form-field__input--invalid]="error() !== null"
    [id]="fieldId()"
    [name]="fieldId()"
    type="number"
    inputmode="numeric"
    autocomplete="off"
    required
    step="1"
    [min]="min()"
    [max]="max()"
    [formControl]="control()"
    [attr.aria-invalid]="error() !== null"
    [attr.aria-describedby]="fieldId() + '-hint' + (error() ? ' ' + fieldId() + '-error' : '')"
  >
  @if (error()) {
    <p class="form-field__error" [id]="fieldId() + '-error'" role="alert">{{ error() }}</p>
  }
</div>
